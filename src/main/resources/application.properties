spring.application.name=peciatka-java

# Default: in-memory H2, so `./mvnw spring-boot:run` works without any setup.
# LOCK_TIMEOUT lets a second transaction wait for a locked card row instead of failing at once.
spring.datasource.url=jdbc:h2:mem:peciatka;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
